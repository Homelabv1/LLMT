# 1B Specialist Models Configuration
# GPU: GTX 1660 Super (6GB VRAM)
# Purpose: Prove fine-tuned sub-2B can achieve 95%+ on bounded use case
#
# Usage:
#   python scripts/batch_test.py --engine ollama --config gpus/nvidia/1660super-1b/models.yaml
#   python scripts/batch_test.py --engine llamacpp --config gpus/nvidia/1660super-1b/models.yaml
#   python scripts/batch_test.py --engine vllm --config gpus/nvidia/1660super-1b/models.yaml

gpu:
  name: "GTX 1660 Super"
  vram_gb: 6
  max_model_vram_gb: 4  # Leave 2GB headroom

inference:
  quantization: "Q4_K_M"
  context_length: 4096

timeouts:
  download_seconds: 600   # 10 min - small models download fast
  load_seconds: 120       # 2 min - small models load fast
  query_seconds: 60       # 1 min per question

cooldown:
  min_seconds: 15         # Small models don't heat GPU much
  target_temp_f: 140      # 60°C

models:
  # ===================
  # PRIMARY - Test First
  # ===================
  - name: "Qwen2.5-1.5B-Instruct"
    params: "1.5B"
    tier: "primary"
    ollama: "qwen2.5:1.5b"
    llamacpp: "Qwen2.5-1.5B-Instruct-Q4_K_M.gguf"
    vllm: "Qwen/Qwen2.5-1.5B-Instruct"
    vram_gb: 1.0
    notes: "Best all-rounder at size"

  - name: "Qwen3-1.7B"
    params: "1.7B"
    tier: "primary"
    ollama: "qwen3:1.7b"
    llamacpp: "Qwen3-1.7B-Q4_K_M.gguf"
    vllm: "Qwen/Qwen3-1.7B"
    vram_gb: 1.2
    notes: "Newer architecture, thinking mode"

  - name: "SmolLM2-1.7B-Instruct"
    params: "1.7B"
    tier: "primary"
    ollama: "smollm2:1.7b"
    llamacpp: "SmolLM2-1.7B-Instruct-Q4_K_M.gguf"
    vllm: "HuggingFaceTB/SmolLM2-1.7B-Instruct"
    vram_gb: 1.2
    notes: "Efficiency focused"

  # ===================
  # SECONDARY
  # ===================
  - name: "Llama-3.2-1B-Instruct"
    params: "1B"
    tier: "secondary"
    ollama: "llama3.2:1b"
    llamacpp: "Llama-3.2-1B-Instruct-Q4_K_M.gguf"
    vllm: "meta-llama/Llama-3.2-1B-Instruct"
    vram_gb: 0.8
    notes: "Meta's latest small"

  - name: "DeepSeek-R1-Distill-Qwen-1.5B"
    params: "1.5B"
    tier: "secondary"
    ollama: "deepseek-r1:1.5b"
    llamacpp: "DeepSeek-R1-Distill-Qwen-1.5B-Q4_K_M.gguf"
    vllm: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    vram_gb: 1.0
    notes: "Reasoning distilled from R1"

  # ===================
  # BASELINE
  # ===================
  - name: "Qwen2.5-0.5B-Instruct"
    params: "0.5B"
    tier: "baseline"
    ollama: "qwen2.5:0.5b"
    llamacpp: "Qwen2.5-0.5B-Instruct-Q4_K_M.gguf"
    vllm: "Qwen/Qwen2.5-0.5B-Instruct"
    vram_gb: 0.5
    notes: "Smallest viable, baseline"

  - name: "TinyLlama-1.1B-Chat"
    params: "1.1B"
    tier: "baseline"
    ollama: "tinyllama:1.1b"
    llamacpp: "TinyLlama-1.1B-Chat-v1.0-Q4_K_M.gguf"
    vllm: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    vram_gb: 0.8
    notes: "Classic small model baseline"

  # ===================
  # OPTIONAL
  # ===================
  - name: "StableLM-2-1.6B-Zephyr"
    params: "1.6B"
    tier: "optional"
    ollama: "stablelm2:1.6b"
    llamacpp: "stablelm-2-zephyr-1_6b-Q4_K_M.gguf"
    vllm: "stabilityai/stablelm-2-zephyr-1_6b"
    vram_gb: 1.1
    notes: "Conversational specialist"

  - name: "Phi-1.5"
    params: "1.3B"
    tier: "optional"
    ollama: "phi:1.5b"
    llamacpp: "phi-1_5-Q4_K_M.gguf"
    vllm: "microsoft/phi-1_5"
    vram_gb: 0.9
    notes: "Microsoft reasoning model"

  - name: "Qwen2.5-Coder-1.5B-Instruct"
    params: "1.5B"
    tier: "optional"
    ollama: "qwen2.5-coder:1.5b"
    llamacpp: "Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf"
    vllm: "Qwen/Qwen2.5-Coder-1.5B-Instruct"
    vram_gb: 1.0
    notes: "Code specialist - might help with JSON"
